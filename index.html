<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Margreiter Variations</title><style>:root{--brand:#c8d52f;--dark:#3f4b55;--muted:#7b8388;--line:#dde0df;--paper:#f7f7f3;--amber:#f2b84b;--red:#b95b4d}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;color:var(--dark)}button,input,textarea,select{font:inherit}.brand{display:block;object-fit:contain}.loginLogo{width:210px;max-height:150px;margin:0 auto 22px}.headerLogo{width:105px;height:46px}.intro{position:fixed;inset:0;z-index:9999;background:#fff;display:flex;align-items:center;justify-content:center}.introLogo{width:min(68vw,310px);opacity:0;transform:translateY(-65vh);animation:impact 1.45s cubic-bezier(.22,.8,.24,1) forwards}.intro.exit{animation:fade .55s forwards}@keyframes impact{0%{opacity:0;transform:translateY(-65vh)}38%{opacity:1;transform:translateY(8px) scale(1.04)}48%{transform:translateX(-8px) rotate(-1deg)}55%{transform:translateX(8px) rotate(1deg)}62%{transform:translateX(-5px)}69%{transform:translateX(4px)}100%{opacity:1;transform:none}}@keyframes fade{to{opacity:0;visibility:hidden}}.login{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:34px;max-width:460px;margin:auto}.shell{display:none;max-width:650px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding:10px 22px}.pad{padding:24px}.screen{display:none}.screen.active{display:block}h1{font-size:34px;margin:24px 0 8px}h2{font-size:25px;margin:8px 0 22px}.sub{color:var(--muted);margin-bottom:22px}.eyebrow,label{font-size:10px;font-weight:bold;letter-spacing:1.5px;color:var(--muted);text-transform:uppercase}.field{margin-bottom:17px}label{display:block;margin-bottom:7px;color:var(--dark)}input,textarea,select{width:100%;padding:14px;border:1px solid var(--line);background:#fff}textarea{min-height:90px}.btn{width:100%;padding:16px;border:0;background:var(--brand);font-weight:800;margin-top:7px}.ghost{background:#fff;border:1px solid var(--line)}.reject{background:#fff;border:1px solid var(--red);color:var(--red)}.back,.logout{border:0;background:none;font-size:11px;font-weight:bold}.projectCard,.regCard{border:1px solid var(--line);padding:17px;margin:10px 0;cursor:pointer}.projectCard small,.regCard small{display:block;color:var(--muted);margin-top:5px}.check{display:flex;gap:12px;align-items:center;border:1px solid var(--line);padding:15px;margin-bottom:15px}.check input{width:22px;height:22px}.check label{margin:0}.box{background:var(--paper);padding:16px;margin:15px 0}.priceBlock{border-bottom:1px solid var(--line);padding:12px 0}.priceRow{display:grid;grid-template-columns:1fr 125px;gap:10px;align-items:center}.priceNote{min-height:62px}.total{display:flex;justify-content:space-between;border-top:1px solid var(--line);padding:18px 0;font-size:24px;font-weight:bold}.filters{display:flex;gap:6px;overflow:auto;margin:14px 0}.filter{white-space:nowrap;border:1px solid var(--line);background:#fff;padding:8px 10px;font-size:10px}.filter.on{background:var(--brand)}.pending{border-left:8px solid var(--amber);background:#fffaf0}.cleared{border-left:8px solid var(--brand)}.hold{border-left:8px solid var(--red);background:#fff7f5}.rejected{border-left:8px solid var(--dark);background:#f5f5f5}.regTop{display:flex;justify-content:space-between;gap:10px}.tag{display:inline-block;background:var(--amber);font-size:9px;font-weight:bold;padding:5px 7px;margin-top:8px}.cleared .tag{background:var(--brand)}.rejected .tag{background:#ddd}.hold .tag{background:#f2c2ba}.capture{background:var(--paper);padding:16px;margin:15px 0;border:1px dashed #aaa}.photoGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.photoBtn{display:block;text-align:center;padding:14px;border:1px solid var(--line);background:#fff;font-size:12px;font-weight:bold;cursor:pointer}.photoBtn input{display:none}.voice{width:100%;padding:16px;background:#fff;border:1px solid #aaa;font-weight:bold}.qty{display:grid;grid-template-columns:1fr 110px;gap:10px}.selectRow{display:grid;grid-template-columns:28px 1fr;gap:8px;align-items:start}.selectRow>input{width:20px;height:20px;margin-top:20px}.exportBox{border:1px solid var(--line);padding:12px;margin:12px 0;background:var(--paper)}.exportGrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}.exportGrid .btn{font-size:10px;padding:12px 4px}.photoThumbs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.photoThumbs img{width:100%;height:150px;object-fit:cover;border:1px solid var(--line)}</style></head><body><div id="intro" class="intro"><img class="brand introLogo" src="file_00000000cdc48210b6ebb9ccd9458e85.png"></div><section id="login" class="login"><img class="brand loginLogo" src="file_00000000cdc48210b6ebb9ccd9458e85.png"><h1>Variations</h1><div class="sub">Raise. Price. Issue. Approve Works.</div><div class="field"><label>Username</label><input id="u"></div><div class="field"><label>Password</label><input id="p" type="password"></div><button class="btn" onclick="go()">LOG IN</button></section><div id="shell" class="shell"><header class="top"><img class="brand headerLogo" src="file_00000000cdc48210b6ebb9ccd9458e85.png"><button class="logout" onclick="out()">LOG OUT</button></header><section id="projects" class="screen pad"><div class="eyebrow">Projects</div><h1>Select project</h1><div id="projectList"></div><button class="btn" onclick="show('projectEntry')">+ ADD PROJECT</button></section><section id="projectEntry" class="screen pad"><button class="back" onclick="show('projects')">← BACK</button><h2>New project</h2><div class="field"><label>Project name</label><input id="newProjectName"></div><div class="field"><label>Project number</label><input id="newProjectNo"></div><div class="field"><label>Client</label><input id="newClient"></div><div class="field"><label>Project QS</label><input id="newQS"></div><div class="field"><label>QS email</label><input id="newQSEmail" type="email"></div><button class="btn" onclick="addProject()">SAVE & OPEN</button></section><section id="home" class="screen pad"><button class="back" onclick="renderProjects();show('projects')">← PROJECTS</button><h1 id="projectTitle"></h1><div id="projectMeta" class="sub"></div><button class="btn" onclick="startNew()">+ RAISE VARIATION</button><button class="btn ghost" onclick="showRegister()">PROJECT REGISTER</button></section><section id="capture" class="screen pad"><button class="back" onclick="show('home')">← BACK</button><h2>Raise variation</h2><div class="check"><input id="raisedByQS" type="checkbox"><label>RAISED BY QS</label></div><div class="field"><label>Raised by</label><input id="raisedBy"></div><div class="field"><label>Location</label><input id="loc"></div><div class="capture"><b>PHOTOS</b><div class="photoGrid"><label class="photoBtn">📷 TAKE PHOTO<input id="cameraPic" type="file" accept="image/*" capture="environment"></label><label class="photoBtn">🖼 ADD PHOTOS<input id="pics" type="file" accept="image/*" multiple></label></div><div id="photoCount" class="sub" style="margin:10px 0 0"></div></div><div class="field"><label>Description</label><button class="voice" onclick="toggleVoice()">🎙 TAP TO SPEAK</button><textarea id="raw"></textarea></div><div class="field"><label>Quantity</label><div class="qty"><input id="qty" type="number"><select id="unit"><option>item</option><option>nr</option><option>lm</option><option>m²</option><option>m³</option><option>hrs</option></select></div></div><button class="btn" onclick="captureVariation()">RAISE</button></section><section id="review" class="screen pad"><button class="back" onclick="showRegister()">← REGISTER</button><div class="eyebrow">QS review</div><h2 id="rref"></h2><div id="reviewBody"></div><div class="field"><label>QS review notes</label><textarea id="reviewNotes"></textarea></div><button class="btn" onclick="reviewToPrice()">CONTINUE TO PRICING</button><button class="btn reject" onclick="rejectVariation()">NOT A VARIATION — EXISTING / IN SCOPE</button></section><section id="price" class="screen pad"><button class="back" onclick="openReview(current)">← REVIEW</button><div class="eyebrow">QS pricing</div><h2 id="pref"></h2><div id="priceDetail" class="box"></div><div id="priceFields"></div><div class="total"><span>TOTAL</span><span id="tot">£0.00</span></div><button class="btn" onclick="savePrice()">SAVE PRICE & CONTINUE</button><button class="btn reject" onclick="rejectVariation()">NOT A VARIATION — EXISTING / IN SCOPE</button></section><section id="decision" class="screen pad"><button class="back" onclick="openPrice(current)">← PRICING</button><div class="eyebrow">QS decision</div><h2 id="dref"></h2><div id="decisionSummary" class="box"></div><div class="check"><input id="issueClient" type="checkbox"><label>ISSUE TO CLIENT — CREATE PDF</label></div><div class="check"><input id="commenceWorks" type="checkbox" onchange="toggleRisk()"><label>APPROVE WORKS TO COMMENCE</label></div><div id="riskOptions" style="display:none"><div class="field"><label>Works authority</label><select id="riskDecision"><option value="At Risk">Proceed at Risk</option><option value="Client Approval Required">Client Approval Required Before Works</option></select></div></div><div class="field"><label>QS comments / instruction</label><textarea id="qsComments"></textarea></div><button class="btn" onclick="saveDecision()">SAVE QS DECISION</button><button class="btn ghost" onclick="printVariation(current)">PRINT / SAVE CLIENT PDF</button><button class="btn reject" onclick="rejectVariation()">NOT A VARIATION — EXISTING / IN SCOPE</button></section><section id="detail" class="screen pad"><button class="back" onclick="showRegister()">← REGISTER</button><div class="eyebrow">Variation record</div><h2 id="detailRef"></h2><div id="detailBody"></div><div id="detailActions"></div></section><section id="register" class="screen pad"><button class="back" onclick="show('home')">← BACK TO PROJECT</button><h1>Variation Register</h1><div id="regProject" class="sub"></div><div class="exportBox"><b>DOWNLOAD CSV</b><div class="exportGrid"><button class="btn ghost" onclick="downloadCSV('current')">CURRENT</button><button class="btn ghost" onclick="downloadCSV('selected')">SELECTED</button><button class="btn ghost" onclick="downloadCSV('all')">ALL</button></div></div><div class="filters" id="filters"></div><div id="registerList"></div></section></div><script>let current={},activeProject=null,filter='All',recognition,listening=false,selected=new Set(),pendingPhotos=[];const $=x=>document.getElementById(x),today=()=>new Date().toISOString().slice(0,10),GRACE=300000;const demos=[['halfmoon','18 Half Moon Street','MRG-001'],['belgravia','Belgravia Townhouse','MRG-002'],['chelsea','Chelsea Residence','MRG-003'],['mayfair','Mayfair Apartment','MRG-004'],['kensington','Kensington Villa','MRG-005']];function safeGet(k){try{return JSON.parse(localStorage.getItem(k)||'[]')}catch(e){return[]}}function initialiseProjects(){let p=safeGet('projects');demos.forEach(d=>{if(!p.some(x=>x.id===d[0]))p.push({id:d[0],name:d[1],number:d[2],client:'Private Client',qs:'',qsEmail:''})});localStorage.setItem('projects',JSON.stringify(p));seedTests()}function seedTests(){let a=safeGet('variations'),titles=['Additional steel support to opening','Relocate socket outlets','Upgrade bathroom stone finish','Additional ceiling access panels','Revised joinery to master dressing room','Additional underfloor heating zone','Replace damaged cornice section','Alter drainage route to kitchen','Additional fire stopping to riser','Bespoke ironmongery change','Additional decoration to stairwell','Revised lighting control positions','Strengthen floor for stone finish','Additional acoustic insulation','Modify external terrace drainage','Additional data points to study','Revised vanity unit dimensions','Additional scaffold adaptation','Door opening alteration','Existing making-good included in contract'],locs=['Basement Plant Room','Ground Floor Kitchen','First Floor Master Suite','Second Floor Bedroom','Stair Hall','Rear Terrace','Roof','Entrance Hall','Study','Bathroom'],st=['With QS','With QS','With QS','With QS','QS Pricing','QS Pricing','QS Pricing','Priced - Not Approved to Proceed','Priced - Not Approved to Proceed','Priced - Not Approved to Proceed','Issued to Client - Works Not Approved','Issued to Client - Works Not Approved','Issued to Client - Works Not Approved','Works Approved to Commence - At Risk','Works Approved to Commence - At Risk','Works Approved to Commence - At Risk','Hold - Client Approval Required','Hold - Client Approval Required','Existing Scope - Works May Proceed','Existing Scope - Works May Proceed'];demos.forEach(d=>{for(let i=0;i<20;i++){let ref='TEST-'+String(i+1).padStart(3,'0');if(a.some(v=>v.projectId===d[0]&&v.ref===ref))continue;let status=st[i],lab=150+i*37,mat=220+i*53,sub=i%3===0?650+i*45:0,oth=i%4===0?120:0,markup=12.5,total=(lab+mat+sub+oth)*1.125,rejected=status.startsWith('Existing'),issued=status.startsWith('Issued')||status.startsWith('Works')||status.startsWith('Hold'),approved=status.startsWith('Works')||status.startsWith('Hold')||rejected;a.push({ref,projectId:d[0],projectName:d[1],projectNumber:d[2],raisedDate:'2026-09-'+String(Math.max(1,16-i)).padStart(2,'0'),raisedBy:['Site Manager','Project Manager','Architect','Interior Designer','Client Representative'][i%5],raisedByQS:false,location:locs[i%locs.length],title:titles[i],found:titles[i]+'. Test record for workflow review.',qty:i%5+1,unit:'item',status,reviewNotes:i>=4?'QS reviewed scope and supporting information.':'',labour:rejected?0:lab,materials:rejected?0:mat,subcontract:rejected?0:sub,other:rejected?0:oth,markup:rejected?0:markup,total:rejected?0:total,labourNote:'Labour allowance based on site resource.',materialsNote:'Materials allowance based on current cost.',subcontractNote:sub?'Specialist subcontract allowance.':'',otherNote:oth?'Associated access / sundry allowance.':'',markupNote:'Contract markup applied.',issuedToClient:issued,issuedDate:issued?'2026-09-16':'',worksApproved:approved,worksAuthority:status.startsWith('Works')?'At Risk':status.startsWith('Hold')?'Client Approval Required':'',rejectedExistingScope:rejected})}});localStorage.setItem('variations',JSON.stringify(a))}function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));$(id).classList.add('active');scrollTo(0,0)}function go(){if(!$('u').value.trim()||!$('p').value)return alert('Enter login details.');localStorage.setItem('mvaUntil',Date.now()+GRACE);enter()}function enter(){initialiseProjects();$('login').style.display='none';$('shell').style.display='block';renderProjects();show('projects')}function out(){localStorage.removeItem('mvaUntil');location.reload()}function projects(){return safeGet('projects')}function allVars(){return safeGet('variations')}function vars(){return activeProject?allVars().filter(v=>v.projectId===activeProject.id):[]}function renderProjects(){$('projectList').innerHTML=projects().map(x=>'<div class="projectCard" onclick="openProject(\''+x.id+'\')"><b>'+esc(x.name)+'</b><small>'+esc(x.number||'')+' · '+allVars().filter(v=>v.projectId===x.id).length+' variations · QS '+esc(x.qs||'Not set')+'</small></div>').join('')}function openProject(id){activeProject=projects().find(x=>x.id===id);if(!activeProject)return;$('projectTitle').textContent=activeProject.name;$('projectMeta').textContent=(activeProject.number||'')+' · '+(activeProject.client||'')+' · QS '+(activeProject.qs||'Not set');show('home')}function addProject(){let name=$('newProjectName').value.trim();if(!name)return alert('Add project name.');let p=projects(),x={id:'p-'+Date.now(),name,number:$('newProjectNo').value.trim(),client:$('newClient').value.trim(),qs:$('newQS').value.trim(),qsEmail:$('newQSEmail').value.trim()};p.push(x);localStorage.setItem('projects',JSON.stringify(p));openProject(x.id)}function save(v){let a=allVars(),i=a.findIndex(x=>x.projectId===v.projectId&&x.ref===v.ref);i>=0?a[i]=v:a.unshift(v);try{localStorage.setItem('variations',JSON.stringify(a))}catch(e){alert('Photo storage is full. Try fewer photos.')}}function startNew(){let nums=vars().filter(v=>/^VAR-\d+$/.test(v.ref||'')).map(v=>+v.ref.slice(4)),n=nums.length?Math.max(...nums)+1:1;current={ref:'VAR-'+String(n).padStart(3,'0'),projectId:activeProject.id,projectName:activeProject.name,projectNumber:activeProject.number,qsName:activeProject.qs,qsEmail:activeProject.qsEmail,raisedDate:today()};pendingPhotos=[];['raisedBy','loc','raw','qty'].forEach(id=>$(id).value='');$('raisedByQS').checked=false;$('cameraPic').value='';$('pics').value='';$('photoCount').textContent='';show('capture')}function compressFile(file){return new Promise(resolve=>{let r=new FileReader();r.onload=e=>{let im=new Image();im.onload=()=>{let max=1200,s=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);resolve(c.toDataURL('image/jpeg',.72))};im.src=e.target.result};r.readAsDataURL(file)})}async function photoChanged(){let fs=[...($('cameraPic').files||[]),...($('pics').files||[])];$('photoCount').textContent=fs.length?'Processing '+fs.length+' photo'+(fs.length>1?'s':'')+'...':'';pendingPhotos=await Promise.all(fs.map(compressFile));$('photoCount').textContent=pendingPhotos.length+' photo'+(pendingPhotos.length!==1?'s':'')+' ready'}function toggleVoice(){let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return $('raw').focus();if(listening)return recognition.stop();recognition=new SR();recognition.lang='en-GB';recognition.onstart=()=>listening=true;recognition.onresult=e=>$('raw').value+=($('raw').value?' ':'')+e.results[0][0].transcript;recognition.onend=()=>listening=false;recognition.start()}function captureVariation(){let by=$('raisedBy').value.trim(),loc=$('loc').value.trim(),raw=$('raw').value.trim();if(!by||!loc||!raw)return alert('Add raised by, location and description.');Object.assign(current,{raisedBy:by,raisedByQS:$('raisedByQS').checked,location:loc,title:raw.split(/[.!?]/)[0].slice(0,60),found:raw,qty:$('qty').value,unit:$('unit').value,photos:pendingPhotos,status:$('raisedByQS').checked?'QS Pricing':'With QS'});save(current);current.raisedByQS?openPrice(current):(alert('Raised and sent to the project QS register for review.'),showRegister())}function openRecord(ref){current=vars().find(v=>v.ref===ref);if(!current)return;if(current.status==='With QS')openReview(current);else if(current.status==='QS Pricing')openPrice(current);else if(['Priced - Not Approved to Proceed','Issued to Client - Works Not Approved'].includes(current.status))openDecision(current);else openDetail(current)}function openReview(v){current=v;$('rref').textContent=v.ref+' · '+(v.title||'');$('reviewBody').innerHTML='<div class="box"><b>Raised information</b><p><b>Location:</b> '+esc(v.location)+'</p><p><b>Description:</b> '+esc(v.found)+'</p><p><b>Quantity:</b> '+esc(v.qty)+' '+esc(v.unit)+'</p><small>Raised by '+esc(v.raisedBy)+' · '+esc(v.raisedDate)+'</small>'+(v.photos?.length?'<div class="photoThumbs">'+v.photos.map(x=>'<img src="'+x+'">').join('')+'</div>':'')+'</div>';$('reviewNotes').value=v.reviewNotes||'';show('review')}function reviewToPrice(){current.reviewNotes=$('reviewNotes').value;current.reviewedDate=today();current.status='QS Pricing';save(current);openPrice(current)}const pf=[['lab','Labour','labour','labourNote'],['mat','Materials','materials','materialsNote'],['sub','Subcontract','subcontract','subcontractNote'],['oth','Other','other','otherNote'],['mark','Markup %','markup','markupNote']];function openPrice(v){current=v;$('pref').textContent=v.ref+' · '+(v.title||'');$('priceDetail').innerHTML='<b>'+esc(v.location)+'</b><br>'+esc(v.found)+(v.reviewNotes?'<br><br><b>QS review:</b> '+esc(v.reviewNotes):'')
