<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Margreiter Variations</title><style>:root{--brand:#c8d52f;--dark:#3f4b55;--muted:#7b8388;--line:#dde0df;--paper:#f7f7f3;--amber:#f2b84b;--red:#b95b4d}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;color:var(--dark)}button,input,textarea,select{font:inherit}.brand{display:block;object-fit:contain}.loginLogo{width:210px;max-height:150px;margin:0 auto 22px}.headerLogo{width:105px;height:46px;object-position:left center}.login{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:34px;max-width:460px;margin:auto}.shell{display:none;max-width:650px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding:10px 22px}.pad{padding:24px}.screen{display:none}.screen.active{display:block}h1{font-size:34px;margin:24px 0 8px}h2{font-size:25px;margin:8px 0 22px}.sub{color:var(--muted);margin-bottom:22px}.eyebrow,label{font-size:10px;font-weight:bold;letter-spacing:1.5px;color:var(--muted);text-transform:uppercase}.field{margin-bottom:17px}label{display:block;margin-bottom:7px;color:var(--dark)}input,textarea,select{width:100%;padding:14px;border:1px solid var(--line);background:#fff}textarea{min-height:110px}.btn{width:100%;padding:16px;border:0;background:var(--brand);font-weight:800;margin-top:7px}.ghost{background:#fff;border:1px solid var(--line)}.reject{background:#fff;border:1px solid var(--red);color:var(--red)}.back,.logout{border:0;background:none;font-size:11px;font-weight:bold}.back{padding:8px 0}.projectCard,.regCard{border:1px solid var(--line);padding:17px;margin:10px 0;cursor:pointer}.projectCard small,.regCard small{display:block;color:var(--muted);margin-top:5px}.check{display:flex;gap:12px;align-items:center;border:1px solid var(--line);padding:15px;margin-bottom:15px}.check input{width:22px;height:22px}.check label{margin:0}.box{background:var(--paper);padding:16px;margin:15px 0}.priceRow{display:grid;grid-template-columns:1fr 125px;gap:10px;align-items:center;margin:8px 0}.total{display:flex;justify-content:space-between;border-top:1px solid var(--line);padding:18px 0;font-size:24px;font-weight:bold}.filters{display:flex;gap:6px;overflow:auto;margin:14px 0}.filter{white-space:nowrap;border:1px solid var(--line);background:#fff;padding:8px 10px;font-size:10px}.filter.on{background:var(--brand)}.pending{border-left:8px solid var(--amber);background:#fffaf0}.cleared{border-left:8px solid var(--brand)}.hold{border-left:8px solid var(--red);background:#fff7f5}.rejected{border-left:8px solid var(--dark);background:#f5f5f5}.regTop{display:flex;justify-content:space-between;gap:10px}.tag{display:inline-block;background:var(--amber);font-size:9px;font-weight:bold;padding:5px 7px;margin-top:8px}.cleared .tag{background:var(--brand)}.rejected .tag{background:#ddd}.hold .tag{background:#f2c2ba}.capture{background:var(--paper);padding:16px;margin:15px 0;text-align:center;border:1px dashed #aaa}.voice{width:100%;padding:16px;background:#fff;border:1px solid #aaa;font-weight:bold}.qty{display:grid;grid-template-columns:1fr 110px;gap:10px}</style></head><body><section id="login" class="login"><img class="brand loginLogo" src="file_00000000cdc48210b6ebb9ccd9458e85.png"><h1>Variations</h1><div class="sub">Raise. Price. Issue. Approve Works.</div><div class="field"><label>Username</label><input id="u"></div><div class="field"><label>Password</label><input id="p" type="password"></div><button class="btn" onclick="go()">LOG IN</button></section><div id="shell" class="shell"><header class="top"><img class="brand headerLogo" src="file_00000000cdc48210b6ebb9ccd9458e85.png"><button class="logout" onclick="out()">LOG OUT</button></header><section id="projects" class="screen pad"><h1>Select project</h1><div id="projectList"></div></section><section id="home" class="screen pad"><button class="back" onclick="show('projects')">← PROJECTS</button><h1 id="projectTitle"></h1><div id="projectMeta" class="sub"></div><button class="btn" onclick="startNew()">+ RAISE VARIATION</button><button class="btn ghost" onclick="showRegister()">PROJECT REGISTER</button></section><section id="capture" class="screen pad"><button class="back" onclick="show('home')">← BACK</button><h2>Raise variation</h2><div class="check"><input id="raisedByQS" type="checkbox"><label>RAISED BY QS</label></div><div class="field"><label>Raised by</label><input id="raisedBy"></div><div class="field"><label>Location</label><input id="loc"></div><div class="capture"><b>ADD PHOTOS</b><input id="pics" type="file" accept="image/*" multiple></div><div class="field"><label>Description</label><button class="voice" onclick="toggleVoice()">🎙 TAP TO SPEAK</button><textarea id="raw"></textarea></div><div class="field"><label>Quantity</label><div class="qty"><input id="qty" type="number"><select id="unit"><option>item</option><option>nr</option><option>lm</option><option>m²</option><option>m³</option><option>hrs</option></select></div></div><button class="btn" onclick="captureVariation()">RAISE</button></section><section id="price" class="screen pad"><button class="back" onclick="showRegister()">← REGISTER</button><div class="eyebrow">QS pricing</div><h2 id="pref"></h2><div id="priceDetail" class="box"></div><div class="priceRow"><span>Labour</span><input id="lab" type="number" oninput="calc()"></div><div class="priceRow"><span>Materials</span><input id="mat" type="number" oninput="calc()"></div><div class="priceRow"><span>Subcontract</span><input id="sub" type="number" oninput="calc()"></div><div class="priceRow"><span>Other</span><input id="oth" type="number" oninput="calc()"></div><div class="priceRow"><span>Markup %</span><input id="mark" type="number" oninput="calc()"></div><div class="total"><span>TOTAL</span><span id="tot">£0.00</span></div><button class="btn" onclick="savePrice()">SAVE PRICE & CONTINUE</button><button class="btn reject" onclick="rejectVariation()">NOT A VARIATION — EXISTING / IN SCOPE</button></section><section id="decision" class="screen pad"><button class="back" onclick="showRegister()">← REGISTER</button><div class="eyebrow">QS decision</div><h2 id="dref"></h2><div id="decisionSummary" class="box"></div><div class="check"><input id="issueClient" type="checkbox"><label>ISSUE TO CLIENT</label></div><div class="check"><input id="commenceWorks" type="checkbox" onchange="toggleRisk()"><label>APPROVE WORKS TO COMMENCE</label></div><div id="riskOptions" style="display:none"><div class="field"><label>Works authority</label><select id="riskDecision"><option value="At Risk">Proceed at Risk</option><option value="Client Approval Required">Client Approval Required Before Works</option></select></div></div><div class="field"><label>QS comments / instruction</label><textarea id="qsComments"></textarea></div><button class="btn" onclick="saveDecision()">SAVE QS DECISION</button><button class="btn reject" onclick="rejectVariation()">NOT A VARIATION — EXISTING / IN SCOPE</button></section><section id="detail" class="screen pad"><button class="back" onclick="showRegister()">← REGISTER</button><div class="eyebrow">Variation record</div><h2 id="detailRef"></h2><div id="detailBody"></div><div id="detailActions"></div></section><section id="register" class="screen pad"><button class="back" onclick="show('home')">← BACK TO PROJECT</button><h1>Variation Register</h1><div id="regProject" class="sub"></div><div class="filters" id="filters"></div><div id="registerList"></div></section></div><script>let current={},activeProject=null,filter='All',recognition,listening=false;const $=x=>document.getElementById(x),today=()=>new Date().toISOString().slice(0,10);function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));$(id).classList.add('active');scrollTo(0,0)}function go(){if($('u').value.trim()&&$('p').value){sessionStorage.setItem('mva','1');enter()}}function enter(){$('login').style.display='none';$('shell').style.display='block';renderProjects();show('projects')}function out(){sessionStorage.removeItem('mva');location.reload()}function projects(){return JSON.parse(localStorage.getItem('projects')||'[]')}function allVars(){return JSON.parse(localStorage.getItem('variations')||'[]')}function vars(){return allVars().filter(v=>v.projectId===activeProject.id)}function renderProjects(){$('projectList').innerHTML=projects().map(x=>'<div class="projectCard" onclick="openProject(\''+x.id+'\')"><b>'+esc(x.name)+'</b><small>'+esc(x.number||'')+' · '+allVars().filter(v=>v.projectId===x.id).length+' variations · QS '+esc(x.qs||'Not set')+'</small></div>').join('')}function openProject(id){activeProject=projects().find(x=>x.id===id);$('projectTitle').textContent=activeProject.name;$('projectMeta').textContent=(activeProject.number||'')+' · QS '+(activeProject.qs||'');show('home')}function save(v){let a=allVars(),i=a.findIndex(x=>x.projectId===v.projectId&&x.ref===v.ref);if(i>=0)a[i]=v;else a.unshift(v);localStorage.setItem('variations',JSON.stringify(a))}function startNew(){let d=vars(),n=d.length?Math.max(...d.map(v=>+v.ref.replace(/\D/g,'')))+1:1;current={ref:'VAR-'+String(n).padStart(3,'0'),projectId:activeProject.id,projectName:activeProject.name,projectNumber:activeProject.number,qsName:activeProject.qs,qsEmail:activeProject.qsEmail,raisedDate:today()};['raisedBy','loc','raw','qty'].forEach(id=>$(id).value='');$('raisedByQS').checked=false;show('capture')}function toggleVoice(){let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return $('raw').focus();if(listening)return recognition.stop();recognition=new SR();recognition.lang='en-GB';recognition.onstart=()=>listening=true;recognition.onresult=e=>$('raw').value+=( $('raw').value?' ':'')+e.results[0][0].transcript;recognition.onend=()=>listening=false;recognition.start()}function captureVariation(){let by=$('raisedBy').value.trim(),loc=$('loc').value.trim(),raw=$('raw').value.trim();if(!by||!loc||!raw)return alert('Add raised by, location and description.');Object.assign(current,{raisedBy:by,raisedByQS:$('raisedByQS').checked,location:loc,title:raw.split(/[.!?]/)[0].slice(0,60),found:raw,qty:$('qty').value,unit:$('unit').value,status:$('raisedByQS').checked?'QS Pricing':'With QS'});save(current);if(current.raisedByQS)openPrice(current);else{alert('Raised and sent to the project QS register for pricing / scope review.');showRegister()}}function openRecord(ref){current=vars().find(v=>v.ref===ref);if(!current)return;if(['With QS','QS Pricing'].includes(current.status))openPrice(current);else if(['Priced - Not Approved to Proceed','Issued to Client - Works Not Approved'].includes(current.status))openDecision(current);else openDetail(current)}function openPrice(v){current=v;$('pref').textContent=v.ref+' · '+v.title;$('priceDetail').innerHTML='<b>'+esc(v.location)+'</b><br>'+esc(v.found||'')+'<br><small>Raised by '+esc(v.raisedBy||'')+(v.raisedByQS?' (QS)':'')+'</small>';$('lab').value=v.labour||0;$('mat').value=v.materials||0;$('sub').value=v.subcontract||0;$('oth').value=v.other||0;$('mark').value=v.markup||0;calc();show('price')}function calc(){let b=+$('lab').value+ +$('mat').value+ +$('sub').value+ +$('oth').value;current.labour=+$('lab').value;current.materials=+$('mat').value;current.subcontract=+$('sub').value;current.other=+$('oth').value;current.markup=+$('mark').value;current.total=b*(1+current.markup/100);$('tot').textContent=money(current.total)}function savePrice(){calc();current.status='Priced - Not Approved to Proceed';current.pricedDate=today();save(current);openDecision(current)}function rejectVariation(){current.rejectedExistingScope=true;current.status='Existing Scope - Works May Proceed';current.total=0;current.worksApproved=true;current.decisionDate=today();save(current);alert('Recorded as existing / in scope. Works may proceed without a variation.');showRegister()}function openDecision(v){current=v;$('dref').textContent=v.ref+' · '+v.title;$('decisionSummary').innerHTML='<b>Priced value: '+money(v.total)+'</b><br><strong>WORKS NOT APPROVED TO COMMENCE</strong><br>'+esc(v.location);$('issueClient').checked=!!v.issueToClient;$('commenceWorks').checked=!!v.worksApproved;$('riskDecision').value=v.riskDecision||'At Risk';$('qsComments').value=v.qsComments||'';toggleRisk();show('decision')}function toggleRisk(){$('riskOptions').style.display=$('commenceWorks').checked?'block':'none'}function saveDecision(){current.issueToClient=$('issueClient').checked;current.worksApproved=$('commenceWorks').checked;current.qsComments=$('qsComments').value;current.clientIssueDate=current.issueToClient?(current.clientIssueDate||today()):'';current.riskDecision=current.worksApproved?$('riskDecision').value:'';current.decisionDate=today();if(current.worksApproved&&current.riskDecision==='At Risk')current.status='Works Approved to Commence - At Risk';else if(current.worksApproved&&current.riskDecision==='Client Approval Required')current.status='Hold - Client Approval Required';else if(current.issueToClient)current.status='Issued to Client - Works Not Approved';else current.status='Priced - Not Approved to Proceed';save(current);showRegister()}function openDetail(v){current=v;$('detailRef').textContent=v.ref+' · '+v.title;let works=v.rejectedExistingScope?'Works may proceed — existing scope':v.worksApproved?(v.riskDecision==='At Risk'?'Works approved to commence — at risk':'Client approval required before works'):'Works not approved to commence';$('detailBody').innerHTML='<div class="box"><b>'+esc(v.location||'')+'</b><p>'+esc(v.found||'')+'</p><small>Raised by '+esc(v.raisedBy||'')+'</small></div><div class="box"><b>Value: '+money(v.total)+'</b><p>Client: '+(v.issueToClient?'Issued':'Not issued')+'</p><p><b>'+esc(works)+'</b></p><p>Status: '+esc(v.status)+'</p></div>';$('detailActions').innerHTML=v.rejectedExistingScope?'':'<button class="btn" onclick="openPrice(current)">EDIT PRICE</button><button class="btn ghost" onclick="openDecision(current)">QS DECISION / ISSUE / WORKS</button>';show('detail')}function showRegister(){filter='All';$('regProject').textContent=activeProject.name+' · '+vars().length+' records';renderRegister();show('register')}function renderRegister(){let ss=['All','QS Action','Priced / Awaiting Decision','Issued','Works Approved','Hold'];$('filters').innerHTML=ss.map(s=>'<button class="filter '+(filter===s?'on':'')+'" onclick="filter=\''+s+'\';renderRegister()">'+s+'</button>').join('');let d=vars().filter(v=>filter==='All'||filter==='QS Action'&&['With QS','QS Pricing'].includes(v.status)||filter==='Priced / Awaiting Decision'&&v.status==='Priced - Not Approved to Proceed'||filter==='Issued'&&v.issueToClient||filter==='Works Approved'&&v.worksApproved||filter==='Hold'&&v.status==='Hold - Client Approval Required');$('registerList').innerHTML=d.map(v=>{let cls=v.rejectedExistingScope?'rejected':v.status==='Hold - Client Approval Required'?'hold':v.worksApproved?'cleared':'pending',works=v.rejectedExistingScope?'Existing scope — proceed':v.worksApproved?'Works approved to commence':'Works NOT approved to commence';return '<div class="regCard '+cls+'" onclick="openRecord(\''+v.ref+'\')"><div class="regTop"><b>'+esc(v.ref)+' · '+esc(v.title)+'</b><b>'+money(v.total)+'</b></div><small>'+esc(v.location||'')+' · '+esc(v.raisedBy||'')+'</small><small>Client: '+(v.issueToClient?'Issued':'Not issued')+' · '+works+'</small><span class="tag">'+esc(v.status)+'</span><small>Tap to open →</small></div>'}).join('')}function money(v){return '£'+Number(v||0).toLocaleString('en-GB',{minimumFractionDigits:2,maximumFractionDigits:2})}function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}if(sessionStorage.getItem('mva'))enter();</script></body></html>
