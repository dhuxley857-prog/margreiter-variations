<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Margreiter Variations</title><style>:root{--lime:#d9ef3f;--ink:#20221f;--line:#ddd}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;color:var(--ink);background:#fff}.intro{position:fixed;inset:0;background:#fff;z-index:10;display:grid;place-items:center;animation:gone .5s 2.25s forwards}.intro:after{content:'';position:absolute;inset:0;background:var(--lime);opacity:0;animation:flash .22s .45s}.logo{font-weight:800;letter-spacing:4px;display:flex;align-items:center;gap:12px;animation:land 1.6s cubic-bezier(.2,.8,.2,1)}.m{width:46px;height:46px;display:grid;place-items:center;background:var(--ink);color:var(--lime);font-size:26px}.login{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:34px;max-width:460px;margin:auto;opacity:0;animation:fade .6s 2s forwards}h1{font-size:34px;margin:42px 0 8px}.sub{color:#777;margin-bottom:28px}.field{margin-bottom:17px}label{font-size:11px;font-weight:bold;letter-spacing:1.5px;display:block;margin-bottom:8px}input{width:100%;padding:15px;border:1px solid var(--line);font:inherit}.btn{width:100%;padding:16px;border:0;background:var(--lime);font-weight:800;margin-top:5px}.err{color:#a22;font-size:13px;margin-top:12px;min-height:18px}.app{display:none;max-width:560px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:20px}.logout{border:0;background:none;color:#777}.new{margin:28px 0}.stats{display:grid;grid-template-columns:repeat(4,1fr);border-block:1px solid var(--line)}.stat{text-align:center;padding:18px 2px;border-right:1px solid var(--line)}.stat:last-child{border:0}.stat b{font-size:22px;display:block}.stat span{font-size:9px;letter-spacing:1px;color:#777}.card{padding:18px 0;border-bottom:1px solid var(--line)}@keyframes flash{50%{opacity:.9}}@keyframes land{0%{transform:scale(1.7);opacity:0}45%{opacity:1}100%{transform:scale(1)}}@keyframes gone{to{opacity:0;visibility:hidden}}@keyframes fade{to{opacity:1}}</style></head><body><div class="intro"><div class="logo"><div class="m">M</div>MARGREITER</div></div><section id="login" class="login"><div class="logo"><div class="m">M</div>MARGREITER</div><h1>Variations</h1><div class="sub">Record. Price. Issue.</div><div class="field"><label>USERNAME</label><input id="u"></div><div class="field"><label>PASSWORD</label><input id="p" type="password"></div><button class="btn" onclick="go()">LOG IN</button><div id="e" class="err"></div></section><main id="app" class="app"><div class="top"><div class="logo"><div class="m">M</div>MARGREITER</div><button class="logout" onclick="out()">LOG OUT</button></div><h1>Variations</h1><div class="sub">Grade II Listed Project</div><button class="btn new">+ NEW VARIATION</button><div class="stats"><div class="stat"><b>2</b><span>OPEN</span></div><div class="stat"><b>1</b><span>READY</span></div><div class="stat"><b>1</b><span>SENT</span></div><div class="stat"><b>1</b><span>AGREED</span></div></div><h3 style="margin-top:30px">Recent</h3><div class="card"><b>VAR-001 · Timber grounds</b><div class="sub">Second Floor / Front Bedroom · Ready · £2,140</div></div></main><script>function go(){if(u.value==='Michael'&&p.value==='Variation1!'){sessionStorage.setItem('mva','1');show()}else e.textContent='Incorrect username or password.'}function show(){login.style.display='none';app.style.display='block'}function out(){sessionStorage.removeItem('mva');location.reload()}if(sessionStorage.getItem('mva')){document.querySelector('.intro').style.display='none';show()}</script></body></html>
