<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Margreiter Variations</title><style>:root{--brand:#c8d52f;--dark:#3f4b55;--muted:#7b8388;--line:#dde0df;--paper:#f7f7f3;--amber:#f2b84b;--red:#b95b4d}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;color:var(--dark)}button,input,textarea,select{font:inherit}.brand{display:block;object-fit:contain}.loginLogo{width:210px;max-height:150px;margin:0 auto 22px}.headerLogo{width:105px;height:46px;object-position:left center}.intro{position:fixed;inset:0;z-index:9999;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden}.introLogo{width:min(68vw,310px);height:auto;opacity:0;transform:translateY(-65vh) scale(.96);animation:introImpact 1.45s cubic-bezier(.22,.8,.24,1) forwards}.intro.exit{animation:introExit .55s ease-in-out forwards}.intro.exit .introLogo{animation:introLogoExit .5s ease-in forwards}@keyframes introImpact{0%{opacity:0;transform:translateY(-65vh) scale(.96)}38%{opacity:1;transform:translateY(8px) scale(1.04)}48%{transform:translate(-8px,0) rotate(-1deg) scale(1.02)}55%{transform:translate(8px,0) rotate(1deg) scale(1.02)}62%{transform:translate(-5px,0) rotate(-.6deg) scale(1.01)}69%{transform:translate(4px,0) rotate(.4deg) scale(1.005)}78%,100%{opacity:1;transform:translate(0,0) rotate(0) scale(1)}}@keyframes introExit{to{opacity:0;visibility:hidden}}@keyframes introLogoExit{to{opacity:0;transform:scale(1.08)}}.login{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:34px;max-width:460px;margin:auto}.shell{display:none;max-width:650px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding:10px 22px}.pad{padding:24px}.screen{display:none}.screen.active{display:block}h1{font-size:34px;margin:24px 0 8px}h2{font-size:25px;margin:8px 0 22px}.sub{color:var(--muted);margin-bottom:22px}.eyebrow,label{font-size:10px;font-weight:bold;letter-spacing:1.5px;color:var(--muted);text-transform:uppercase}.field{margin-bottom:17px}label{display:block;margin-bottom:7px;color:var(--dark)}input,textarea,select{width:100%;padding:14px;border:1px solid var(--line);background:#fff}textarea{min-height:90px}.btn{width:100%;padding:16px;border:0;background:var(--brand);font-weight:800;margin-top:7px}.ghost{background:#fff;border:1px solid var(--line)}.reject{background:#fff;border:1px solid var(--red);color:var(--red)}.back,.logout{border:0;background:none;font-size:11px;font-weight:bold}.back{padding:8px 0}.projectCard,.regCard{border:1px solid var(--line);padding:17px;margin:10px 0;cursor:pointer}.projectCard small,.regCard small{display:block;color:var(--muted);margin-top:5px}.check{display:flex;gap:12px;align-items:center;border:1px solid var(--line);padding:15px;margin-bottom:15px}.check input{width:22px;height:22px}.check label{margin:0}.box{background:var(--paper);padding:16px;margin:15px 0}.priceBlock{border-bottom:1px solid var(--line);padding:12px 0}.priceRow{display:grid;grid-template-columns:1fr 125px;gap:10px;align-items:center;margin:4px 0 8px}.priceNote{min-height:62px}.total{display:flex;justify-content:space-between;border-top:1px solid var(--line);padding:18px 0;font-size:24px;font-weight:bold}.filters{display:flex;gap:6px;overflow:auto;margin:14px 0}.filter{white-space:nowrap;border:1px solid var(--line);background:#fff;padding:8px 10px;font-size:10px}.filter.on{background:var(--brand)}.pending{border-left:8px solid var(--amber);background:#fffaf0}.cleared{border-left:8px solid var(--brand)}.hold{border-left:8px solid var(--red);background:#fff7f5}.rejected{border-left:8px solid var(--dark);background:#f5f5f5}.regTop{display:flex;justify-content:space-between;gap:10px}.tag{display:inline-block;background:var(--amber);font-size:9px;font-weight:bold;padding:5px 7px;margin-top:8px}.cleared .tag{background:var(--brand)}.rejected .tag{background:#ddd}.hold .tag{background:#f2c2ba}.capture{background:var(--paper);padding:16px;margin:15px 0;text-align:center;border:1px dashed #aaa}.voice{width:100%;padding:16px;background:#fff;border:1px solid #aaa;font-weight:bold}.qty{display:grid;grid-template-columns:1fr 110px;gap:10px}</style></head><body><div id="intro" class="intro"><img class="brand introLogo" src="file_00000000cdc48210b6ebb9ccd9458e85.png" alt="Margreiter"></div><section id="login" class="login"><img class="brand loginLogo" src="file_00000000cdc48210b6ebb9ccd9458e85.png"><h1>Variations</h1><div class="sub">Raise. Price. Issue. Approve Works.</div><div class="field"><label>Username</label><input id="u"></div><div class="field"><label>Password</label><input id="p" type="password"></div><button class="btn" onclick="go()">LOG IN</button></section><div id="shell" class="shell"><header class="top"><img class="brand headerLogo" src="file_00000000cdc48210b6ebb9ccd9458e85.png"><button class="logout" onclick="out()">LOG OUT</button></header><section id="projects" class="screen pad"><div class="eyebrow">Projects</div><h1>Select project</h1><div id="projectList"></div><button class="btn" onclick="show('projectEntry')">+ ADD PROJECT</button></section><section id="projectEntry" class="screen pad"><button class="back" onclick="show('projects')">← BACK</button><h2>New project</h2><div class="field"><label>Project name</label><input id="newProjectName"></div><div class="field"><label>Project number</label><input id="newProjectNo"></div><div class="field"><label>Client</label><input id="newClient"></div><div class="field"><label>Project QS</label><input id="newQS"></div><div class="field"><label>QS email</label><input id="newQSEmail" type="email"></div><button class="btn" onclick="addProject()">SAVE & OPEN</button></section><section id="home" class="screen pad"><button class="back" onclick="renderProjects();show('projects')">← PROJECTS</button><h1 id="projectTitle"></h1><div id="projectMeta" class="sub"></div><button class="btn" onclick="startNew()">+ RAISE VARIATION</button><button class="btn ghost" onclick="showRegister()">PROJECT REGISTER</button></section><section id="capture" class="screen pad"><button class="back" onclick="show('home')">← BACK</button><h2>Raise variation</h2><div class="check"><input id="raisedByQS" type="checkbox"><label>RAISED BY QS</label></div><div class="field"><label>Raised by</label><input id="raisedBy"></div><div class="field"><label>Location</label><input id="loc"></div><div class="capture"><b>ADD PHOTOS</b><input id="pics" type="file" accept="image/*" multiple></div><div class="field"><label>Description</label><button class="voice" onclick="toggleVoice()">🎙 TAP TO SPEAK</button><textarea id="raw"></textarea></div><div class="field"><label>Quantity</label><div class="qty"><input id="qty" type="number"><select id="unit"><option>item</option><option>nr</option><option>lm</option><option>m²</option><option>m³</option><option>hrs</option></select></div></div><button class="btn" onclick="captureVariation()">RAISE</button></section><section id="review" class="screen pad"><button class="back" onclick="showRegister()">← REGISTER</button><div class="eyebrow">QS review</div><h2 id="rref"></h2><div id="reviewBody"></div><div class="field"><label>QS review notes</label><textarea id="reviewNotes" placeholder="Scope observations, queries or notes..."></textarea></div><button class="btn" onclick="reviewToPrice()">CONTINUE TO PRICING</button><button class="btn reject" onclick="rejectVariation()">NOT A VARIATION — EXISTING / IN SCOPE</button></section><section id="price" class="screen pad"><button class="back" onclick="openReview(current)">← REVIEW</button><div class="eyebrow">QS pricing</div><h2 id="pref"></h2><div id="priceDetail" class="box"></div><div class="priceBlock"><div class="priceRow"><span>Labour</span><input id="lab" type="number" oninput="calc()"></div><textarea id="labNote" class="priceNote" placeholder="Labour description / build-up / notes"></textarea></div><div class="priceBlock"><div class="priceRow"><span>Materials</span><input id="mat" type="number" oninput="calc()"></div><textarea id="matNote" class="priceNote" placeholder="Materials description / build-up / notes"></textarea></div><div class="priceBlock"><div class="priceRow"><span>Subcontract</span><input id="sub" type="number" oninput="calc()"></div><textarea id="subNote" class="priceNote" placeholder="Subcontract description / quotation / notes"></textarea></div><div class="priceBlock"><div class="priceRow"><span>Other</span><input id="oth" type="number" oninput="calc()"></div><textarea id="othNote" class="priceNote" placeholder="Other cost description / notes"></textarea></div><div class="priceBlock"><div class="priceRow"><span>Markup %</span><input id="mark" type="number" oninput="calc()"></div><textarea id="markNote" class="priceNote" placeholder="Markup basis / notes"></textarea></div><div class="total"><span>TOTAL</span><span id="tot">£0.00</span></div><button class="btn" onclick="savePrice()">SAVE PRICE & CONTINUE</button><button class="btn reject" onclick="rejectVariation()">NOT A VARIATION — EXISTING / IN SCOPE</button></section><section id="decision" class="screen pad"><button class="back" onclick="openPrice(current)">← PRICING</button><div class="eyebrow">QS decision</div><h2 id="dref"></h2><div id="decisionSummary" class="box"></div><div class="check"><input id="issueClient" type="checkbox"><label>ISSUE TO CLIENT</label></div><div class="check"><input id="commenceWorks" type="checkbox" onchange="toggleRisk()"><label>APPROVE WORKS TO COMMENCE</label></div><div id="riskOptions" style="display:none"><div class="field"><label>Works authority</label><select id="riskDecision"><option value="At Risk">Proceed at Risk</option><option value="Client Approval Required">Client Approval Required Before Works</option></select></div></div><div class="field"><label>QS comments / instruction</label><textarea id="qsComments"></textarea></div><button class="btn" onclick="saveDecision()">SAVE QS DECISION</button><button class="btn reject" onclick="rejectVariation()">NOT A VARIATION — EXISTING / IN SCOPE</button></section><section id="detail" class="screen pad"><button class="back" onclick="showRegister()">← REGISTER</button><div class="eyebrow">Variation record</div><h2 id="detailRef"></h2><div id="detailBody"></div><div id="detailActions"></div></section><section id="register" class="screen pad"><button class="back" onclick="show('home')">← BACK TO PROJECT</button><h1>Variation Register</h1><div id="regProject" class="sub"></div><div class="filters" id="filters"></div><div id="registerList"></div></section></div><script>let current={},activeProject=null,filter='All',recognition,listening=false;const $=x=>document.getElementById(x),today=()=>new Date().toISOString().slice(0,10);const demos=[['halfmoon','18 Half Moon Street','MRG-001'],['belgravia','Belgravia Townhouse','MRG-002'],['chelsea','Chelsea Residence','MRG-003'],['mayfair','Mayfair Apartment','MRG-004'],['kensington','Kensington Villa','MRG-005']];function safeGet(k){try{return JSON.parse(localStorage.getItem(k)||'[]')}catch(e){return[]}}function initialiseProjects(){let p=safeGet('projects');demos.forEach(d=>{if(!p.some(x=>x.id===d[0]))p.push({id:d[0],name:d[1],number:d[2],client:'Private Client',qs:'',qsEmail:''})});localStorage.setItem('projects',JSON.stringify(p))}function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));$(id).classList.add('active');scrollTo(0,0)}function go(){if($('u').value.trim()&&$('p').value){enter()}else alert('Enter login details.')}function enter(){initialiseProjects();$('login').style.display='none';$('shell').style.display='block';renderProjects();show('projects')}function out(){location.reload()}function projects(){return safeGet('projects')}function allVars(){return safeGet('variations')}function vars(){return activeProject?allVars().filter(v=>v.projectId===activeProject.id):[]}function renderProjects(){initialiseProjects();$('projectList').innerHTML=projects().map(x=>'<div class="projectCard" onclick="openProject(\''+x.id+'\')"><b>'+esc(x.name)+'</b><small>'+esc(x.number||'')+' · '+allVars().filter(v=>v.projectId===x.id).length+' variations · QS '+esc(x.qs||'Not set')+'</small></div>').join('')}function openProject(id){activeProject=projects().find(x=>x.id===id);if(!activeProject)return renderProjects();$('projectTitle').textContent=activeProject.name;$('projectMeta').textContent=(activeProject.number||'')+(activeProject.client?' · '+activeProject.client:'')+' · QS '+(activeProject.qs||'Not set');show('home')}function addProject(){let name=$('newProjectName').value.trim();if(!name)return alert('Add project name.');let p=projects(),id='p-'+Date.now();let x={id,name,number:$('newProjectNo').value.trim(),client:$('newClient').value.trim(),qs:$('newQS').value.trim(),qsEmail:$('newQSEmail').value.trim()};p.push(x);localStorage.setItem('projects',JSON.stringify(p));['newProjectName','newProjectNo','newClient','newQS','newQSEmail'].forEach(i=>$(i).value='');openProject(id)}function save(v){let a=allVars(),i=a.findIndex(x=>x.projectId===v.projectId&&x.ref===v.ref);if(i>=0)a[i]=v;else a.unshift(v);localStorage.setItem('variations',JSON.stringify(a))}function startNew(){let d=vars(),nums=d.map(v=>+(String(v.ref||'').replace(/\D/g,''))).filter(Number.isFinite),n=nums.length?Math.max(...nums)+1:1;current={ref:'VAR-'+String(n).padStart(3,'0'),projectId:activeProject.id,projectName:activeProject.name,projectNumber:activeProject.number,qsName:activeProject.qs,qsEmail:activeProject.qsEmail,raisedDate:today()};['raisedBy','loc','raw','qty'].forEach(id=>$(id).value='');$('raisedByQS').checked=false;show('capture')}function toggleVoice(){let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return $('raw').focus();if(listening)return recognition.stop();recognition=new SR();recognition.lang='en-GB';recognition.onstart=()=>listening=true;recognition.onresult=e=>$('raw').value+=( $('raw').value?' ':'')+e.results[0][0].transcript;recognition.onend=()=>listening=false;recognition.start()}function captureVariation(){let by=$('raisedBy').value.trim(),loc=$('loc').value.trim(),raw=$('raw').value.trim();if(!by||!loc||!raw)return alert('Add raised by, location and description.');Object.assign(current,{raisedBy:by,raisedByQS:$('raisedByQS').checked,location:loc,title:raw.split(/[.!?]/)[0].slice(0,60),found:raw,qty:$('qty').value,unit:$('unit').value,status:$('raisedByQS').checked?'QS Pricing':'With QS'});save(current);if(current.raisedByQS)openPrice(current);else{alert('Raised and sent to the project QS register for review.');showRegister()}}function openRecord(ref){current=vars().find(v=>v.ref===ref);if(!current)return;if(current.status==='With QS')openReview(current);else if(current.status==='QS Pricing')openPrice(current);else if(['Priced - Not Approved to Proceed','Issued to Client - Works Not Approved'].includes(current.status))openDecision(current);else openDetail(current)}function openReview(v){current=v;$('rref').textContent=v.ref+' · '+(v.title||'');$('reviewBody').innerHTML='<div class="box"><b>Raised information</b><p><b>Location:</b> '+esc(v.location||'')+'</p><p><b>Description:</b> '+esc(v.found||'')+'</p><p><b>Quantity:</b> '+esc(v.qty||'')+' '+esc(v.unit||'')+'</p><small>Raised by '+esc(v.raisedBy||'')+' · '+esc(v.raisedDate||'')+'</small></div>';$('reviewNotes').value=v.reviewNotes||'';show('review')}function reviewToPrice(){current.reviewNotes=$('reviewNotes').value;current.reviewedDate=today();current.status='QS Pricing';save(current);openPrice(current)}function openPrice(v){current=v;$('pref').textContent=v.ref+' · '+(v.title||'');$('priceDetail').innerHTML='<b>'+esc(v.location||'')+'</b><br>'+esc(v.found||'')+(v.reviewNotes?'<br><br><b>QS review:</b> '+esc(v.reviewNotes):'')+'<br><small>Raised by '+esc(v.raisedBy||'')+(v.raisedByQS?' (QS)':'')+'</small>';['lab','mat','sub','oth','mark'].forEach(id=>$(id).value=v[id==='mat'?'materials':id==='sub'?'subcontract':id==='oth'?'other':id==='mark'?'markup':'labour']||0);$('labNote').value=v.labourNote||'';$('matNote').value=v.materialsNote||'';$('subNote').value=v.subcontractNote||'';$('othNote').value=v.otherNote||'';$('markNote').value=v.markupNote||'';calc();show('price')}function calc(){let b=+$('lab').value+ +$('mat').value+ +$('sub').value+ +$('oth').value;current.labour=+$('lab').value;current.materials=+$('mat').value;current.subcontract=+$('sub').value;current.other=+$('oth').value;current.markup=+$('mark').value;current.total=b*(1+current.markup/100);$('tot').textContent=money(current.total)}function savePrice(){calc();current.labourNote=$('labNote').value;current.materialsNote=$('matNote').value;current.subcontractNote=$('subNote').value;current.otherNote=$('othNote').value;current.markupNote=$('markNote').value;current.status='Priced - Not Approved to Proceed';current.pricedDate=today();save(current);openDecision(current)}function openDecision(v){current=v;$('dref').textContent=v.ref+' · '+(v.title||'');$('decisionSummary').innerHTML='<b>'+money(v.total||0)+'</b><br>'+esc(v.location||'')+'<br><small>WORKS NOT APPROVED TO COMMENCE</small>';$('issueClient').checked=!!v.issuedToClient;$('commenceWorks').checked=!!v.worksApproved;$('riskDecision').value=v.worksAuthority||'At Risk';$('qsComments').value=v.qsComments||'';toggleRisk();show('decision')}function toggleRisk(){$('riskOptions').style.display=$('commenceWorks').checked?'block':'none'}function saveDecision(){current.issuedToClient=$('issueClient').checked;if(current.issuedToClient&&!current.issuedDate)current.issuedDate=today();current.worksApproved=$('commenceWorks').checked;current.worksAuthority=current.worksApproved?$('riskDecision').value:'';current.qsComments=$('qsComments').value;current.decisionDate=today();if(current.worksApproved&&current.worksAuthority==='At Risk')current.status='Works Approved to Commence - At Risk';else if(current.worksApproved)current.status='Hold - Client Approval Required';else if(current.issuedToClient)current.status='Issued to Client - Works Not Approved';else current.status='Priced - Not Approved to Proceed';save(current);showRegister()}function rejectVariation(){if(!current.ref)return;current.rejectedExistingScope=true;current.status='Existing Scope - Works May Proceed';current.total=0;current.worksApproved=true;current.decisionDate=today();if($('reviewNotes')&&$('review').classList.contains('active'))current.reviewNotes=$('reviewNotes').value;save(current);alert('Recorded as existing / in scope. Works may proceed without a variation.');showRegister()}function showRegister(){filter='All';$('regProject').textContent=activeProject.name;renderFilters();renderRegister();show('register')}function renderFilters(){let f=['All','QS Action','Priced / Awaiting Decision','Issued','Works Approved','Hold'];$('filters').innerHTML=f.map(x=>'<button class="filter '+(filter===x?'on':'')+'" onclick="setFilter(\''+x+'\')">'+x+'</button>').join('')}function setFilter(f){filter=f;renderFilters();renderRegister()}function match(v){if(filter==='All')return true;if(filter==='QS Action')return['With QS','QS Pricing'].includes(v.status);if(filter==='Priced / Awaiting Decision')return v.status==='Priced - Not Approved to Proceed';if(filter==='Issued')return !!v.issuedToClient;if(filter==='Works Approved')return !!v.worksApproved&&!v.rejectedExistingScope;if(filter==='Hold')return v.status==='Hold - Client Approval Required';return true}function renderRegister(){$('registerList').innerHTML=vars().filter(match).map(v=>{let c=v.rejectedExistingScope?'rejected':v.status==='Hold - Client Approval Required'?'hold':v.worksApproved?'cleared':'pending';return '<div class="regCard '+c+'" onclick="openRecord(\''+v.ref+'\')"><div class="regTop"><b>'+v.ref+' · '+esc(v.title||'')+'</b><b>'+money(v.total||0)+'</b></div><small>'+esc(v.location||'')+' · '+esc(v.raisedDate||'')+'</small><span class="tag">'+esc(v.status||'')+'</span></div>'}).join('')||'<div class="sub">No records in this view.</div>'}function openDetail(v){current=v;$('detailRef').textContent=v.ref+' · '+(v.title||'');$('detailBody').innerHTML='<div class="box"><p><b>Location:</b> '+esc(v.location||'')+'</p><p><b>Raised by:</b> '+esc(v.raisedBy||'')+'</p><p><b>Description:</b> '+esc(v.found||'')+'</p><p><b>Value:</b> '+money(v.total||0)+'</p><p><b>Client issue:</b> '+(v.issuedToClient?'Issued '+esc(v.issuedDate||''):'Not issued')+'</p><p><b>Works:</b> '+(v.worksApproved?(v.rejectedExistingScope?'May proceed - existing scope':'Approved to commence'+(v.worksAuthority?' · '+esc(v.worksAuthority):'')):'NOT APPROVED TO COMMENCE')+'</p><p><b>Status:</b> '+esc(v.status||'')+'</p></div>';$('detailActions').innerHTML=v.rejectedExistingScope?'':'<button class="btn ghost" onclick="openReview(current)">REVIEW ORIGINAL RAISE</button><button class="btn ghost" onclick="openPrice(current)">EDIT PRICE</button><button class="btn" onclick="openDecision(current)">QS DECISION / ISSUE / WORKS</button>';show('detail')}function money(n){return '£'+Number(n||0).toLocaleString('en-GB',{minimumFractionDigits:2,maximumFractionDigits:2})}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function playIntro(){let i=$('intro');if(!i)return;setTimeout(()=>i.classList.add('exit'),1550);setTimeout(()=>i.remove(),2150)}window.addEventListener('load',()=>{sessionStorage.removeItem('mva');$('login').style.display='flex';$('shell').style.display='none';playIntro()});</script></body></html>
