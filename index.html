<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Margreiter Variations</title><style>:root{--brand:#c8d52f;--dark:#3f4b55;--muted:#7b8388;--line:#dde0df;--paper:#f7f7f3;--amber:#f2b84b;--red:#b95b4d}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;color:var(--dark)}button,input,textarea,select{font:inherit}.brand{display:block;object-fit:contain}.loginLogo{width:210px;max-height:150px;margin:0 auto 22px}.headerLogo{width:105px;height:46px;object-position:left center}.login{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:34px;max-width:460px;margin:auto}.shell{display:none;max-width:650px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding:10px 22px}.pad{padding:24px}.screen{display:none}.screen.active{display:block}h1{font-size:34px;margin:24px 0 8px}h2{font-size:25px;margin:8px 0 22px}.sub{color:var(--muted);margin-bottom:22px}.eyebrow,label{font-size:10px;font-weight:bold;letter-spacing:1.5px;color:var(--muted);text-transform:uppercase}.field{margin-bottom:17px}label{display:block;margin-bottom:7px;color:var(--dark)}input,textarea,select{width:100%;padding:14px;border:1px solid var(--line);background:#fff}textarea{min-height:110px}.btn{width:100%;padding:16px;border:0;background:var(--brand);font-weight:800;margin-top:7px}.ghost{background:#fff;border:1px solid var(--line)}.reject{background:#fff;border:1px solid var(--red);color:var(--red)}.back,.logout{border:0;background:none;font-size:11px;font-weight:bold}.back{padding:8px 0}.projectCard,.regCard{border:1px solid var(--line);padding:17px;margin:10px 0}.projectCard,.regCard{cursor:pointer}.projectCard small,.regCard small{display:block;color:var(--muted);margin-top:5px}.stats{display:grid;grid-template-columns:repeat(4,1fr);border-block:1px solid var(--line);margin:22px 0}.stat{text-align:center;padding:16px 2px;border-right:1px solid var(--line)}.stat:last-child{border:0}.stat b{font-size:21px;display:block}.stat span{font-size:8px}.capture,.notice,.box{background:var(--paper);padding:16px;margin:15px 0}.capture{text-align:center;border:1px dashed #aaa}.voice{width:100%;padding:16px;background:#fff;border:1px solid #aaa;font-weight:bold}.qty{display:grid;grid-template-columns:1fr 110px;gap:10px}.check{display:flex;gap:12px;align-items:center;border:1px solid var(--line);padding:15px;margin-bottom:15px}.check input{width:22px;height:22px}.check label{margin:0}.priceRow{display:grid;grid-template-columns:1fr 125px;gap:10px;align-items:center;margin:8px 0}.total{display:flex;justify-content:space-between;border-top:1px solid var(--line);padding:18px 0;font-size:24px;font-weight:bold}.filters{display:flex;gap:6px;overflow:auto;margin:14px 0}.filter{white-space:nowrap;border:1px solid var(--line);background:#fff;padding:8px 10px;font-size:10px}.filter.on{background:var(--brand)}.pending{border-left:8px solid var(--amber);background:#fffaf0}.cleared{border-left:8px solid var(--brand)}.hold{border-left:8px solid var(--red);background:#fff7f5}.rejected{border-left:8px solid var(--dark);background:#f5f5f5}.regTop{display:flex;justify-content:space-between;gap:10px}.tag{display:inline-block;background:var(--amber);font-size:9px;font-weight:bold;padding:5px 7px;margin-top:8px}.cleared .tag{background:var(--brand)}.rejected .tag{background:#ddd}.hold .tag{background:#f2c2ba}.actions{margin-top:22px}.actions .btn{margin-top:9px}</style></head><body><section id="login" class="login"><img class="brand loginLogo" src="file_00000000cdc48210b6ebb9ccd9458e85.png"><h1>Variations</h1><div class="sub">Raise. Price. Decide. Issue. Proceed.</div><div class="field"><label>Username</label><input id="u"></div><div class="field"><label>Password</label><input id="p" type="password"></div><button class="btn" onclick="go()">LOG IN</button></section><div id="shell" class="shell"><header class="top"><img class="brand headerLogo" src="file_00000000cdc48210b6ebb9ccd9458e85.png"><button class="logout" onclick="out()">LOG OUT</button></header><section id="projects" class="screen pad"><h1>Select project</h1><div id="projectList"></div><button class="btn" onclick="show('projectEntry')">+ ADD PROJECT</button></section><section id="projectEntry" class="screen pad"><button class="back" onclick="show('projects')">← BACK</button><h2>New project</h2><div class="field"><label>Project name</label><input id="newProjectName"></div><div class="field"><label>Project number</label><input id="newProjectNo"></div><div class="field"><label>Client</label><input id="newClient"></div><div class="field"><label>Project QS</label><input id="newQS"></div><div class="field"><label>QS email</label><input id="newQSEmail" type="email"></div><button class="btn" onclick="addProject()">SAVE & OPEN</button></section><section id="home" class="screen pad"><button class="back" onclick="show('projects')">← PROJECTS</button><h1 id="projectTitle"></h1><div id="projectMeta" class="sub"></div><button class="btn" onclick="startNew()">+ RAISE VARIATION</button><div class="stats"><div class="stat"><b id="draftN">0</b><span>NEW</span></div><div class="stat"><b id="qsN">0</b><span>QS ACTION</span></div><div class="stat"><b id="approvedN">0</b><span>PRICED</span></div><div class="stat"><b id="issuedN">0</b><span>ISSUED</span></div></div><button class="btn ghost" onclick="showRegister()">PROJECT REGISTER</button><button class="btn ghost" onclick="downloadCSV()">DOWNLOAD VARIATIONS FOR BOQ</button></section><section id="capture" class="screen pad"><button class="back" onclick="show('home')">← BACK</button><h2>Raise variation</h2><div class="check"><input id="raisedByQS" type="checkbox"><label>RAISED BY QS</label></div><div class="field"><label>Raised by</label><input id="raisedBy"></div><div class="field"><label>Location</label><input id="loc"></div><div class="capture"><b>ADD PHOTOS</b><input id="pics" type="file" accept="image/*" multiple></div><div class="field"><label>Description</label><button class="voice" onclick="toggleVoice()">🎙 TAP TO SPEAK</button><textarea id="raw"></textarea></div><div class="field"><label>Quantity</label><div class="qty"><input id="qty" type="number"><select id="unit"><option>item</option><option>nr</option><option>lm</option><option>m²</option><option>m³</option><option>hrs</option></select></div></div><button class="btn" onclick="captureVariation()">RAISE</button></section><section id="price" class="screen pad"><button class="back" onclick="showRegister()">← REGISTER</button><div class="eyebrow">QS pricing</div><h2 id="pref"></h2><div id="priceDetail" class="box"></div><div class="priceRow"><span>Labour</span><input id="lab" type="number" oninput="calc()"></div><div class="priceRow"><span>Materials</span><input id="mat" type="number" oninput="calc()"></div><div class="priceRow"><span>Subcontract</span><input id="sub" type="number" oninput="calc()"></div><div class="priceRow"><span>Other</span><input id="oth" type="number" oninput="calc()"></div><div class="priceRow"><span>Markup %</span><input id="mark" type="number" oninput="calc()"></div><div class="total"><span>TOTAL</span><span id="tot">£0.00</span></div><button class="btn" onclick="savePrice()">SAVE PRICE & DECIDE</button><button class="btn reject" onclick="rejectVariation()">REJECT — EXISTING / IN SCOPE</button></section><section id="decision" class="screen pad"><button class="back" onclick="showRegister()">← REGISTER</button><div class="eyebrow">QS commercial decision</div><h2 id="dref"></h2><div id="decisionSummary" class="box"></div><div class="check"><input id="issueClient" type="checkbox"><label>ISSUE TO CLIENT</label></div><div class="check"><input id="commenceWorks" type="checkbox" onchange="toggleRisk()"><label>COMMENCE WORKS</label></div><div id="riskOptions" style="display:none"><div class="field"><label>Works authority</label><select id="riskDecision"><option value="At Risk">Proceed at Risk</option><option value="Client Approval Required">Client Approval Required Before Works</option></select></div></div><div class="field"><label>QS comments / instruction</label><textarea id="qsComments"></textarea></div><button class="btn" onclick="saveDecision()">SAVE QS DECISION</button><button class="btn reject" onclick="rejectVariation()">REJECT — EXISTING / IN SCOPE</button></section><section id="detail" class="screen pad"><button class="back" onclick="showRegister()">← REGISTER</button><div class="eyebrow">Variation record</div><h2 id="detailRef"></h2><div id="detailBody"></div><div id="detailActions" class="actions"></div></section><section id="register" class="screen pad"><button class="back" onclick="show('home')">← BACK TO PROJECT</button><h1>Variation Register</h1><div id="regProject" class="sub"></div><div class="filters" id="filters"></div><div id="registerList"></div><button class="btn ghost" onclick="downloadCSV()">DOWNLOAD VARIATIONS FOR BOQ</button></section></div><script>let current={},activeProject=null,filter='All',recognition,listening=false;const $=x=>document.getElementById(x),today=()=>new Date().toISOString().slice(0,10);const demos=[['halfmoon','18 Half Moon Street','MRG-001'],['belgravia','Belgravia Townhouse','MRG-002'],['chelsea','Chelsea Residence','MRG-003'],['mayfair','Mayfair Apartment','MRG-004'],['kensington','Kensington Villa','MRG-005']];const titles=['Structural opening revision','Bathroom layout change','Stone flooring alteration','Additional joinery works','Lighting layout revision','Drainage alteration','Plaster repairs','Roof access amendment','Kitchen services relocation','Decorative moulding addition','Basement waterproofing repair','Ironmongery upgrade','Additional fire stopping','External stone repair','Heating controls amendment'];function seed(){let p=JSON.parse(localStorage.getItem('projects')||'[]');demos.forEach(d=>{let x=p.find(v=>v.id===d[0]);if(!x)p.push({id:d[0],name:d[1],number:d[2],client:'Private Client',qs:'James Carter',qsEmail:'james.carter@example.com'});else{x.qs=x.qs||'James Carter';x.qsEmail=x.qsEmail||'james.carter@example.com'}});localStorage.setItem('projects',JSON.stringify(p));let a=JSON.parse(localStorage.getItem('variations')||'[]');demos.forEach((d,pi)=>titles.forEach((t,i)=>{let ref='VAR-'+String(i+1).padStart(3,'0');if(a.some(v=>v.projectId===d[0]&&v.ref===ref))return;let q=i%4===0,stage=i%5,b=800+i*300+pi*100,v={demo:true,projectId:d[0],projectName:d[1],projectNumber:d[2],ref,title:t,location:['Hall','Bathroom','Kitchen','Bedroom','Landing'][i%5],raisedBy:q?'James Carter':'Site Manager',raisedByQS:q,qsName:'James Carter',raisedDate:'2026-09-17',found:t,works:'Additional works required.',qty:1,unit:'item',labour:0,materials:0,subcontract:0,other:0,markup:10,total:0,status:q?'QS Pricing':'With QS'};if(stage>=2){v.labour=b*.4;v.materials=b*.35;v.subcontract=b*.25;v.total=b*1.1;v.status='Priced'}if(stage===3){v.issueToClient=true;v.status='Issued to Client'}if(stage===4){v.issueToClient=true;v.commenceWorks=true;v.riskDecision=i%2?'At Risk':'Client Approval Required';v.status=v.riskDecision==='At Risk'?'Proceeding at Risk':'Hold - Client Approval'}a.push(v)}));localStorage.setItem('variations',JSON.stringify(a))}function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));$(id).classList.add('active');scrollTo(0,0)}function go(){if($('u').value.trim()&&$('p').value){sessionStorage.setItem('mva','1');enter()}else alert('Enter login details.')}function enter(){seed();$('login').style.display='none';$('shell').style.display='block';renderProjects();show('projects')}function out(){sessionStorage.removeItem('mva');location.reload()}function projects(){seed();return JSON.parse(localStorage.getItem('projects')||'[]')}function allVars(){return JSON.parse(localStorage.getItem('variations')||'[]')}function vars(){return allVars().filter(v=>v.projectId===activeProject.id)}function renderProjects(){$('projectList').innerHTML=projects().map(x=>'<div class="projectCard" onclick="openProject(\''+x.id+'\')"><b>'+esc(x.name)+'</b><small>'+esc(x.number)+' · '+allVars().filter(v=>v.projectId===x.id).length+' variations · QS '+esc(x.qs||'Not set')+'</small></div>').join('')}function addProject(){let p=projects(),x={id:'p'+Date.now(),name:$('newProjectName').value.trim(),number:$('newProjectNo').value.trim(),client:$('newClient').value.trim(),qs:$('newQS').value.trim(),qsEmail:$('newQSEmail').value.trim()};if(!x.name||!x.qs)return alert('Enter project and QS.');p.push(x);localStorage.setItem('projects',JSON.stringify(p));openProject(x.id)}function openProject(id){activeProject=projects().find(x=>x.id===id);$('projectTitle').textContent=activeProject.name;$('projectMeta').textContent=activeProject.number+' · QS '+activeProject.qs;renderHome();show('home')}function save(v){let a=allVars(),i=a.findIndex(x=>x.projectId===v.projectId&&x.ref===v.ref);if(i>=0)a[i]=v;else a.unshift(v);localStorage.setItem('variations',JSON.stringify(a));renderHome()}function startNew(){let d=vars(),n=d.length?Math.max(...d.map(v=>+v.ref.replace(/\D/g,'')))+1:1;current={ref:'VAR-'+String(n).padStart(3,'0'),projectId:activeProject.id,projectName:activeProject.name,projectNumber:activeProject.number,qsName:activeProject.qs,qsEmail:activeProject.qsEmail,raisedDate:today()};['raisedBy','loc','raw','qty'].forEach(id=>$(id).value='');$('raisedByQS').checked=false;show('capture')}function toggleVoice(){let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return $('raw').focus();if(listening)return recognition.stop();recognition=new SR();recognition.lang='en-GB';recognition.onstart=()=>listening=true;recognition.onresult=e=>$('raw').value+=( $('raw').value?' ':'')+e.results[0][0].transcript;recognition.onend=()=>listening=false;recognition.start()}function captureVariation(){let by=$('raisedBy').value.trim(),loc=$('loc').value.trim(),raw=$('raw').value.trim();if(!by||!loc||!raw)return alert('Add raised by, location and description.');Object.assign(current,{raisedBy:by,raisedByQS:$('raisedByQS').checked,location:loc,title:raw.split(/[.!?]/)[0].slice(0,60),found:raw,works:'Additional works required in accordance with project requirements.',qty:$('qty').value,unit:$('unit').value});current.status=current.raisedByQS?'QS Pricing':'With QS';if(!current.raisedByQS)current.sentToQSDate=today();save(current);if(current.raisedByQS)openPrice(current);else{alert('Raised and added to the QS register for review.');showRegister()}}function openRecord(ref){current=vars().find(v=>v.ref===ref);if(!current)return;if(['With QS','QS Pricing'].includes(current.status))openPrice(current);else if(current.status==='Priced')openDecision(current);else openDetail(current)}function openPrice(v){current=v;$('pref').textContent=v.ref+' · '+v.title;$('priceDetail').innerHTML='<b>'+esc(v.location)+'</b><br>'+esc(v.found)+'<br><small>Raised by '+esc(v.raisedBy)+(v.raisedByQS?' (QS)':'')+'</small>';$('lab').value=v.labour||0;$('mat').value=v.materials||0;$('sub').value=v.subcontract||0;$('oth').value=v.other||0;$('mark').value=v.markup||0;calc();show('price')}function calc(){let b=+$('lab').value+ +$('mat').value+ +$('sub').value+ +$('oth').value;current.labour=+$('lab').value;current.materials=+$('mat').value;current.subcontract=+$('sub').value;current.other=+$('oth').value;current.markup=+$('mark').value;current.total=b*(1+current.markup/100);$('tot').textContent=money(current.total)}function savePrice(){calc();current.status='Priced';current.pricedDate=today();save(current);openDecision(current)}function rejectVariation(){current.rejectedExistingScope=true;current.status='Rejected - Existing Scope';current.total=0;current.commenceWorks=true;current.riskDecision='Existing Scope - Proceed';current.decisionDate=today();save(current);alert('Recorded as existing / in scope. Works may proceed without a variation.');showRegister()}function openDecision(v){current=v;$('dref').textContent=v.ref+' · '+v.title;$('decisionSummary').innerHTML='<b>Priced value: '+money(v.total)+'</b><br>'+esc(v.location)+'<br><small>QS: '+esc(v.qsName||activeProject.qs)+'</small>';$('issueClient').checked=!!v.issueToClient;$('commenceWorks').checked=!!v.commenceWorks;$('riskDecision').value=v.riskDecision||'At Risk';$('qsComments').value=v.qsComments||'';toggleRisk();show('decision')}function toggleRisk(){$('riskOptions').style.display=$('commenceWorks').checked?'block':'none'}function saveDecision(){current.issueToClient=$('issueClient').checked;current.commenceWorks=$('commenceWorks').checked;current.qsComments=$('qsComments').value;current.clientIssueDate=current.issueToClient?(current.clientIssueDate||today()):'';current.riskDecision=current.commenceWorks?$('riskDecision').value:'';current.decisionDate=today();if(current.commenceWorks&&current.riskDecision==='Client Approval Required')current.status='Hold - Client Approval';else if(current.commenceWorks&&current.riskDecision==='At Risk')current.status='Proceeding at Risk';else if(current.issueToClient)current.status='Issued to Client';else current.status='Priced';save(current);showRegister()}function openDetail(v){current=v;$('detailRef').textContent=v.ref+' · '+v.title;let client=v.issueToClient?'Issued '+(v.clientIssueDate||''):'Not issued',works=v.rejectedExistingScope?'Proceed — existing scope':v.commenceWorks?(v.riskDecision||'Commence works'):'Not authorised';$('detailBody').innerHTML='<div class="box"><b>'+esc(v.location)+'</b><p>'+esc(v.found||'')+'</p><small>Raised by '+esc(v.raisedBy||'')+(v.raisedByQS?' (QS)':'')+' · '+esc(v.raisedDate||'')+'</small></div><div class="box"><b>Value: '+money(v.total)+'</b><p>Client: '+esc(client)+'</p><p>Works: '+esc(works)+'</p><p>Status: '+esc(v.status)+'</p></div>';$('detailActions').innerHTML=v.rejectedExistingScope?'':('<button class="btn" onclick="openPrice(current)">EDIT PRICE</button><button class="btn ghost" onclick="openDecision(current)">QS DECISION / ISSUE / WORKS</button>');show('detail')}function renderHome(){let d=vars();$('draftN').textContent=d.filter(v=>v.status==='Draft').length;$('qsN').textContent=d.filter(v=>['With QS','QS Pricing'].includes(v.status)).length;$('approvedN').textContent=d.filter(v=>['Priced','Issued to Client','Proceeding at Risk','Hold - Client Approval'].includes(v.status)).length;$('issuedN').textContent=d.filter(v=>v.issueToClient).length}function showRegister(){filter='All';$('regProject').textContent=activeProject.name+' · '+vars().length+' records';renderRegister();show('register')}function renderRegister(){let ss=['All','QS Action','Priced','Issued to Client','Proceeding at Risk','Hold - Client Approval','Rejected - Existing Scope'];$('filters').innerHTML=ss.map(s=>'<button class="filter '+(filter===s?'on':'')+'" onclick="filter=\''+s+'\';renderRegister()">'+s+'</button>').join('');let d=vars().filter(v=>filter==='All'||(filter==='QS Action'&&['With QS','QS Pricing'].includes(v.status))||v.status===filter);$('registerList').innerHTML=d.map(v=>{let cls=v.rejectedExistingScope?'rejected':v.status==='Hold - Client Approval'?'hold':['With QS','QS Pricing'].includes(v.status)?'pending':'cleared';return '<div class="regCard '+cls+'" onclick="openRecord(\''+v.ref+'\')"><div class="regTop"><b>'+esc(v.ref)+' · '+esc(v.title)+'</b><b>'+money(v.total)+'</b></div><small>'+esc(v.location)+' · '+esc(v.raisedBy)+(v.raisedByQS?' (QS)':'')+'</small><small>Client: '+(v.issueToClient?'Issued':'Not issued')+' · Works: '+(v.commenceWorks?(v.riskDecision||'Authorised'):'Not authorised')+'</small><span class="tag">'+esc(v.status)+'</span><small>Tap to open →</small></div>'}).join('')}function downloadCSV(){let d=vars().filter(v=>!v.rejectedExistingScope),h=['Project','Ref','Title','Location','Raised By','Raised By QS','QS','Labour','Materials','Subcontract','Other','Markup %','Total','Issue To Client','Client Issue Date','Commence Works','Works Decision','Status'];let rows=d.map(v=>[v.projectName,v.ref,v.title,v.location,v.raisedBy,v.raisedByQS?'Yes':'No',v.qsName,v.labour,v.materials,v.subcontract,v.other,v.markup,v.total,v.issueToClient?'Yes':'No',v.clientIssueDate,v.commenceWorks?'Yes':'No',v.riskDecision,v.status]),csv=[h,...rows].map(r=>r.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(',')).join('\r\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=(activeProject.number||activeProject.name)+'_variations_for_BOQ.csv';a.click()}function money(v){return '£'+Number(v||0).toLocaleString('en-GB',{minimumFractionDigits:2,maximumFractionDigits:2})}function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}if(sessionStorage.getItem('mva'))enter();</script></body></html>
